<!doctype html>
<html lang="en" data-theme="tair">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/vendor/remixicon/remixicon.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    {% include header.html %}
    <main>{{ content }}</main>
    {% include footer.html %}

    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/request-form.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/copy-code.js' | relative_url }}" defer></script>
  </body>
</html>
